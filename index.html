<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tin học 6 – Ôn tập giữa kì I</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#667085;--accent:#2f5bea;--accent-t:#fff;--ok:#16794c;--okbg:#e3f6ec;--bad:#b42318;--badbg:#fde8e6;--line:#e0e5ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--text:#e8ecf4;--muted:#9aa4b8;--accent:#6c8cff;--accent-t:#0b1020;--ok:#5dd39e;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--line:#2b3244;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--text:#e8ecf4;--muted:#9aa4b8;--accent:#6c8cff;--accent-t:#0b1020;--ok:#5dd39e;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--line:#2b3244;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.btn{background:var(--accent);color:var(--accent-t);border:0;border-radius:10px;padding:12px 20px;font-size:1rem;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
select{font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#timer{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
#timer.low{color:var(--bad)}
.sec h2{font-size:1.1rem;margin:0 0 2px}.ins{color:var(--muted);font-style:italic;margin:0 0 10px}
.pre{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px;white-space:pre-line}
.q{padding:12px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.qt{font-weight:600;margin-bottom:6px}
.qt img{display:block;max-height:140px;max-width:100%;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:10px;margin:5px 0;cursor:pointer}
.opt input{margin-top:5px}
.opt:has(input:checked){border-color:var(--accent);background:var(--bg)}
input[type=text]{width:100%;padding:10px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.ok{border-color:var(--ok)!important;background:var(--okbg)!important}.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.res{margin-top:6px;font-size:.95rem}.res b.g{color:var(--ok)}.res b.r{color:var(--bad)}
.score{text-align:center}.big{font-size:3.2rem;font-weight:800;color:var(--accent);line-height:1.1}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.warn{color:var(--bad);font-weight:600;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style></head><body>

{title:'Phần 1: Thông tin, dữ liệu và vật mang tin (Câu 1–12)',items:[
M('Hoạt động thông tin là gì?',['Tiếp nhận thông tin','Xử lí, lưu trữ thông tin','Truyền (trao đổi) thông tin','Tất cả các đáp án trên'],'D'),
M('Dữ liệu hoặc lệnh được nhập vào máy tính được gọi là gì?',['Dữ liệu được lưu trữ.','Thông tin vào.','Thông tin ra.','Thông tin máy tính.'],'B'),
M('Phát biểu nào sau đây là đúng?',['Dữ liệu chỉ có thể được hiểu bởi những người có trình độ cao.','Dữ liệu là những giá trị số do con người nghĩ ra.','Dữ liệu được thể hiện dưới dạng con số, văn bản, hình ảnh, âm thanh.','Dữ liệu chỉ có ở trong máy tính.'],'C'),
M('Công cụ nào sau đây không phải là vật mang tin?',['Giấy.','Cuộn phim.','Thẻ nhớ.','Xô, chậu.'],'D'),
M('Em cần nấu một nồi cơm. Hãy xác định những thông tin nào cần xử lí?',['Kiểm tra gạo trong thùng còn không','Nước cho vào nồi đã đủ chưa','Bếp nấu đã chuẩn bị sẵn sàng chưa','Tất cả các thông tin trên'],'D'),
M('Thông tin có thể giúp cho con người những gì?',['Nắm được quy luật của tự nhiên và do đó trở nên mạnh mẽ hơn.','Hiểu biết về cuộc sống và xã hội xung quanh.','Biết được các tin tức và sự kiện xảy ra trong xã hội.','Tất cả các khẳng định trên đều đúng.'],'D'),
M('Phương án nào sau đây là thông tin?',['Các con số thu thập được qua cuộc điều tra dân số.','Kiến thức về phân bố dân cư.','Phiếu điều tra dân số.','Tệp lưu trữ tài liệu về điều tra dân số.'],'B',{ex:'Kiến thức rút ra được (mang lại hiểu biết) là thông tin; các con số là dữ liệu; phiếu và tệp là vật mang tin. Lưu ý: file đề cương đánh dấu đáp án C, nhưng theo định nghĩa thì B đúng hơn — hãy hỏi lại thầy/cô nếu khác.'}),
M('Xem bản tin dự báo thời tiết như Hình 1, bạn Khoa kết luận: “Hôm nay, trời có mưa”. Phát biểu nào sau đây đúng?',['Bản tin dự báo thời tiết là dữ liệu, kết luận của Khoa là thông tin.','Bản tin dự báo thời tiết là thông tin, kết luận của Khoa là dữ liệu.','Những con số trong bản tin dự báo thời tiết là thông tin.','Bản tin dự báo thời tiết và kết luận của Khoa đều là dữ liệu.'],'A',{img:IMG1}),
M('Bảng chỉ dẫn là:',['Vật mang tin','Thông tin','Dữ liệu','Vật mang tin, thông tin và dữ liệu'],'A'),

let n=0;SEC.forEach(s=>s.items.forEach(i=>{i.id=n++}));
const TOTAL=n,W=10/TOTAL,$=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=x=>String(Math.round(x*100)/100).replace('.',',');
let ans={},end=0,tick=null,warned=false,mins=45;
const answered=()=>Object.keys(ans).length;
function home(){clearInterval(tick);app.innerHTML=`<div class="wrap"><div class="card"><h1>💻 Tin học 6 – Ôn tập giữa kì I</h1><p>Năm học 2026–2027 · ${TOTAL} câu trắc nghiệm (mỗi câu ${fmt(W)}đ). Hết giờ hệ thống tự nộp; nộp xong sẽ có điểm (thang 10) và đáp án đúng.</p><div class="row"><label>Thời gian: <select id="mins">${[15,30,45,60].map(m=>`<option value="${m}"${m===mins?' selected':''}>${m} phút</option>`).join('')}</select></label><button class="btn" id="go">Bắt đầu làm bài</button></div></div></div>`;$('#mins').onchange=e=>mins=+e.target.value;$('#go').onclick=start}
function start(){ans={};warned=false;end=Date.now()+mins*60000;renderExam();scrollTo(0,0);clearInterval(tick);tick=setInterval(upd,500);upd()}
function qHTML(i){return `<div class="q"><div class="qt">Câu ${i.id+1}. ${esc(i.q)}${i.img?`<img src="${i.img}" alt="">`:''}</div>`+i.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i.id}" data-id="${i.id}" data-k="${j}"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join('')+`</div>`}
function renderExam(){app.innerHTML=`<div id="bar"><div><div id="timer">--:--</div><small id="prog"></small></div><button class="btn" id="sub">Nộp bài</button></div><div class="wrap" id="exam">`+SEC.map(s=>`<div class="card sec"><h2>${s.title}</h2>${s.items.map(qHTML).join('')}</div>`).join('')+`<div id="msg" class="warn"></div><div class="row"><button class="btn" id="sub2">Nộp bài</button></div></div>`;
 $('#sub').onclick=$('#sub2').onclick=submit;$('#exam').addEventListener('input',e=>{ans[+e.target.dataset.id]=+e.target.dataset.k;warned=false;upd()})}
function upd(){const left=Math.max(0,Math.round((end-Date.now())/1000)),t=$('#timer');if(!t)return;t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');t.classList.toggle('low',left<300);$('#prog').textContent=`Đã làm ${answered()}/${TOTAL} câu`;if(left<=0)finish()}
function submit(){const un=TOTAL-answered();if(un>0&&!warned){warned=true;$('#msg').textContent=`Còn ${un} câu chưa làm. Bấm “Nộp bài” lần nữa nếu muốn nộp luôn.`;$('#msg').scrollIntoView({block:'center'});return}finish()}
const L=(i,j)=>j==null?'(chưa làm)':'ABCD'[j]+'. '+i.o[j];
function finish(){clearInterval(tick);const tl=$('#timer')?$('#timer').textContent:'';let right=0;
 const rows=SEC.map(s=>{const r=s.items.filter(i=>ans[i.id]===i.a).length;right+=r;return `<tr><td>${s.title.replace(/ \(Câu.*\)/,'')}</td><td>${r}/${s.items.length}</td></tr>`}).join('');
 const rev=SEC.map(s=>`<div class="card sec"><h2>${s.title}</h2>`+s.items.map(i=>{const ok=ans[i.id]===i.a;return `<div class="q ${ok?'ok':'bad'}" style="border-radius:10px;padding:10px;margin:8px 0;border:1px solid"><div class="qt">Câu ${i.id+1}. ${esc(i.q)}${i.img?`<img src="${i.img}" alt="">`:''}</div><div class="res">${ok?'<b class="g">✓ Đúng</b> – '+esc(L(i,i.a)):`<b class="r">✗ Sai</b> – Bạn chọn: ${esc(L(i,ans[i.id]))}<br><b class="g">Đáp án đúng:</b> ${esc(L(i,i.a))}`}${i.ex?`<br><small>💡 ${esc(i.ex)}</small>`:''}</div></div>`}).join('')+`</div>`).join('');
 app.innerHTML=`<div class="wrap"><div class="card score"><div>Kết quả của bạn</div><div class="big">${fmt(right*W)}/10</div><p>Đúng <b>${right}/${TOTAL}</b> câu · Thời gian còn lại ${tl}</p><table>${rows}</table><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="redo">🔄 Làm lại đề từ đầu</button><button class="btn ghost" id="wrong">Chỉ xem câu sai</button></div></div>${rev}</div>`;
 scrollTo(0,0);$('#redo').onclick=start;let only=false;$('#wrong').onclick=e=>{only=!only;document.querySelectorAll('.q.ok').forEach(x=>x.style.display=only?'none':'');e.target.textContent=only?'Xem tất cả':'Chỉ xem câu sai'}}
home();
